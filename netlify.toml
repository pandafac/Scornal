# Scornal · Netlify 部署配置
# 纯静态 PWA（原生 ES Modules，无需构建），发布目录就是仓库根目录。

[build]
  publish = "."
  command = ""

[build.environment]
  # 明确关闭自动依赖安装，避免 Netlify 误判为 Node 项目
  NETLIFY_USE_YARN = "false"

# ── Service Worker：必须每次回源，否则用户会被旧版本永久锁死 ──
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# ── 入口 HTML：不缓存，保证发版后立即生效 ──
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── PWA manifest ──
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# ── 源码：由 SW 做 network-first，短缓存即可 ──
[[headers]]
  for = "/src/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/src/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/src/assets/avatar-catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── 图片素材：内容稳定，长缓存 ──
[[headers]]
  for = "/src/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# ── 安全与隐私响应头（本应用数据全部留在本机，无后端、无三方请求）──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"
